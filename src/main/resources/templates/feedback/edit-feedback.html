<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Edit Feedback</title></head><body><main><section class="mx-auto max-w-2xl rounded-2xl border border-app-border bg-app-panel p-7"><h3 class="text-xl font-semibold">Edit feedback</h3><form th:action="@{/user/feedbacks/update}" method="post" class="mt-6 space-y-4"><input type="hidden" name="feedbackId" th:value="${feedback.feedbackId}" /><div><label class="mb-2 block text-sm text-app-muted">Type</label><select name="type" class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm"><option th:selected="${feedback.type == 'FEEDBACK'}">FEEDBACK</option><option th:selected="${feedback.type == 'COMPLAINT'}">COMPLAINT</option></select></div><div><label class="mb-2 block text-sm text-app-muted">Message</label><textarea name="message" rows="4" required class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm" th:text="${feedback.message}"></textarea></div><div><label class="mb-2 block text-sm text-app-muted">Rating</label><div class="flex gap-4 text-sm text-app-muted"><label th:each="i : ${#numbers.sequence(1, 5)}" class="inline-flex items-center gap-1"><input type="radio" name="rating" th:value="${i}" th:checked="${i == feedback.rating}" /><span th:text="${i}"></span></label></div></div><div class="flex gap-3"><button type="submit" class="rounded-lg bg-app-accent px-4 py-2 text-sm font-semibold text-white hover:bg-app-accent/90">Update</button><a th:href="@{/user/feedbacks}" class="rounded-lg border border-app-border px-4 py-2 text-sm">Cancel</a></div></form></section></main></body></html>
