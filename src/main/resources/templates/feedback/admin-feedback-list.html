<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Feedback</title></head><body><main><section class="grid gap-4 lg:grid-cols-2"><article th:each="fb : ${feedbacks}" class="rounded-2xl border border-app-border bg-app-panel p-5"><div class="flex items-center justify-between"><h4 class="font-semibold" th:text="${fb.userName}"></h4><span class="rounded-full border border-app-border px-2 py-1 text-xs" th:text="${fb.status}"></span></div><p class="mt-2 text-xs text-app-muted" th:text="${fb.type} + ' • ' + ${fb.createdDate}"></p><p class="mt-3 text-sm" th:text="${fb.message}"></p><p class="mt-2 text-xs text-app-muted">Rating: <span th:text="${fb.rating}"></span>/5</p><p th:if="${fb.adminResponse != null && !fb.adminResponse.isEmpty()}" class="mt-3 rounded-lg border border-app-border bg-app-panel2 p-3 text-xs text-app-muted" th:text="${fb.adminResponse}"></p><div class="mt-4 flex gap-2"><a th:href="@{/admin/feedbacks/resolve/{id}(id=${fb.feedbackId})}" class="rounded-lg border border-app-accent/40 px-3 py-1.5 text-xs text-app-accent hover:bg-app-accent/10">Resolve</a><form th:action="@{/admin/feedbacks/delete/{id}(id=${fb.feedbackId})}" method="post"><button type="submit" class="rounded-lg border border-red-500/40 px-3 py-1.5 text-xs text-red-300 hover:bg-red-500/10">Delete</button></form></div></article></section></main></body></html>
