<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Resolve Feedback</title></head><body><main><section class="mx-auto max-w-2xl rounded-2xl border border-app-border bg-app-panel p-7"><h3 class="text-xl font-semibold">Resolve feedback</h3><p class="mt-2 text-sm text-app-muted" th:text="${feedback.message}"></p><form th:action="@{/admin/feedbacks/resolve}" method="post" class="mt-6 space-y-4"><input type="hidden" name="feedbackId" th:value="${feedback.feedbackId}" /><div><label class="mb-2 block text-sm text-app-muted">Admin response</label><textarea name="adminResponse" rows="4" required class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm"></textarea></div><div class="flex gap-3"><button type="submit" class="rounded-lg bg-app-accent px-4 py-2 text-sm font-semibold text-white hover:bg-app-accent/90">Submit response</button><a th:href="@{/admin/feedbacks}" class="rounded-lg border border-app-border px-4 py-2 text-sm">Cancel</a></div></form></section></main></body></html>
