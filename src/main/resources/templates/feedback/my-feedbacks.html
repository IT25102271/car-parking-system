<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>My Feedback</title></head><body><main><section class="mb-5 flex items-center justify-between"><h3 class="text-xl font-semibold">My feedback</h3><a th:href="@{/user/feedbacks/submit}" class="rounded-lg bg-app-accent px-4 py-2 text-sm font-semibold text-white hover:bg-app-accent/90">Submit feedback</a></section><section class="grid gap-4 lg:grid-cols-2"><article th:each="fb : ${feedbacks}" class="rounded-2xl border border-app-border bg-app-panel p-5"><div class="flex items-center justify-between"><span class="rounded-full border border-app-border px-2 py-1 text-xs" th:text="${fb.type}"></span><span class="text-xs text-app-muted" th:text="${fb.createdDate}"></span></div><p class="mt-3 text-sm text-app-text" th:text="${fb.message}"></p><p class="mt-3 text-xs text-app-muted">Rating: <span th:text="${fb.rating}"></span>/5</p><div class="mt-3 text-xs text-app-muted">Status: <span th:text="${fb.status}"></span></div><p th:if="${fb.adminResponse != null && !fb.adminResponse.isEmpty()}" class="mt-3 rounded-lg border border-app-border bg-app-panel2 p-3 text-xs text-app-muted" th:text="${fb.adminResponse}"></p><a th:href="@{/user/feedbacks/edit/{id}(id=${fb.feedbackId})}" class="mt-4 inline-flex rounded-lg border border-app-border px-3 py-1.5 text-xs hover:border-app-accent/50">Edit</a></article></section></main></body></html>
