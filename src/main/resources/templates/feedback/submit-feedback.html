<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Submit Feedback</title></head>
<body>
<main>
    <form th:action="@{/user/feedbacks/submit}" method="post" class="mx-auto max-w-2xl space-y-4">
        <div>
            <label class="mb-1 block text-xs text-app-muted">Type</label>
            <select name="type" class="w-full rounded border border-app-border bg-app-panel2 px-3 py-2 text-sm focus:border-app-accent focus:outline-none">
                <option>FEEDBACK</option>
                <option>COMPLAINT</option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-xs text-app-muted">Message</label>
            <textarea name="message" rows="4" required class="w-full rounded border border-app-border bg-app-panel2 px-3 py-2 text-sm focus:border-app-accent focus:outline-none"></textarea>
        </div>
        <div>
            <label class="mb-2 block text-xs text-app-muted">Rating</label>
            <div class="flex gap-4 text-sm text-app-text">
                <label th:each="i : ${#numbers.sequence(1, 5)}" class="inline-flex items-center gap-1">
                    <input type="radio" name="rating" th:value="${i}" th:checked="${i == 3}" />
                    <span th:text="${i}"></span>
                </label>
            </div>
        </div>
        <div class="flex gap-2 border-t border-app-border pt-4">
            <button type="submit" class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Submit</button>
            <a th:href="@{/user/feedbacks}" class="rounded px-3 py-2 text-xs font-medium text-app-muted ring-1 ring-app-border hover:text-app-text">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
