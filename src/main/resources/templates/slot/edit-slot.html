<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Slot</title></head>
<body>
<main>
    <section class="mx-auto max-w-2xl rounded-2xl border border-app-border bg-app-panel p-7">
        <h3 class="text-xl font-semibold">Edit parking slot</h3>
        <form th:action="@{/admin/slots/update}" method="post" class="mt-6 grid gap-4 md:grid-cols-2">
            <input type="hidden" name="slotId" th:value="${slot.slotId}" />
            <div>
                <label class="mb-2 block text-sm text-app-muted">Slot number</label>
                <input type="text" name="slotNumber" th:value="${slot.slotNumber}" required
                       class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm" />
            </div>
            <div>
                <label class="mb-2 block text-sm text-app-muted">Floor</label>
                <select name="floor" required
                        class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm">
                    <option th:if="${!#lists.contains(floors, slot.floor)}"
                            th:value="${slot.floor}"
                            th:text="${slot.floor}"
                            selected>Legacy floor</option>
                    <option th:each="f : ${floors}"
                            th:value="${f}"
                            th:text="${f}"
                            th:selected="${slot.floor == f}">Ground</option>
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm text-app-muted">Type</label>
                <select name="type" class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm">
                    <option th:selected="${slot.type == 'CAR'}">CAR</option>
                    <option th:selected="${slot.type == 'BIKE'}">BIKE</option>
                    <option th:selected="${slot.type == 'VAN'}">VAN</option>
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm text-app-muted">Status</label>
                <select name="status" class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm">
                    <option th:selected="${slot.status == 'AVAILABLE'}">AVAILABLE</option>
                    <option th:selected="${slot.status == 'OCCUPIED'}">OCCUPIED</option>
                    <option th:selected="${slot.status == 'MAINTENANCE'}">MAINTENANCE</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-sm text-app-muted">Rate per hour</label>
                <input type="number" step="0.01" name="ratePerHour" th:value="${slot.ratePerHour}" required
                       class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm" />
            </div>
            <div class="flex gap-3 md:col-span-2">
                <button type="submit" class="rounded-lg bg-app-accent px-4 py-2 text-sm font-semibold text-white">Update slot</button>
                <a th:href="@{/admin/slots}" class="rounded-lg border border-app-border px-4 py-2 text-sm">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
