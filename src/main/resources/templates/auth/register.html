<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CarParking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0b0b10] font-sans text-[#f2f3f7] antialiased">
<div class="mx-auto grid min-h-screen w-full max-w-7xl items-center px-6 py-10 lg:grid-cols-2 lg:gap-12">
    <section class="hidden lg:block">
        <p class="text-xs uppercase tracking-[0.2em] text-[#9b9aa5]">Create Account</p>
        <h1 class="mt-4 text-5xl font-extrabold leading-tight">Start smarter parking<br/>with CarParking.</h1>
        <p class="mt-5 max-w-xl text-[#9b9aa5]">Register once and manage your vehicles, bookings, bills, and support interactions in a clean operations-first dashboard.</p>
    </section>

    <section class="rounded-xl border border-[#2a2932] bg-[#131216] p-8 shadow-2xl md:p-10">
        <p class="text-xs uppercase tracking-[0.14em] text-[#9b9aa5]">Register</p>
        <h2 class="mt-2 text-3xl font-bold">Create your account</h2>

        <form th:action="@{/register}" method="post" class="mt-6 grid gap-4 md:grid-cols-2">
            <div class="md:col-span-2">
                <label class="mb-2 block text-xs uppercase tracking-wide text-[#9b9aa5]">Full Name</label>
                <input type="text" name="name" required class="w-full rounded-md border border-[#2a2932] bg-[#1b1a21] px-3 py-2.5 text-sm focus:border-[#1249dc] focus:outline-none" />
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-xs uppercase tracking-wide text-[#9b9aa5]">Email Address</label>
                <input type="email" name="email" required class="w-full rounded-md border border-[#2a2932] bg-[#1b1a21] px-3 py-2.5 text-sm focus:border-[#1249dc] focus:outline-none" />
            </div>
            <div>
                <label class="mb-2 block text-xs uppercase tracking-wide text-[#9b9aa5]">Password</label>
                <input type="password" name="password" required class="w-full rounded-md border border-[#2a2932] bg-[#1b1a21] px-3 py-2.5 text-sm focus:border-[#1249dc] focus:outline-none" />
            </div>
            <div>
                <label class="mb-2 block text-xs uppercase tracking-wide text-[#9b9aa5]">Phone Number</label>
                <input type="text" name="phone" required class="w-full rounded-md border border-[#2a2932] bg-[#1b1a21] px-3 py-2.5 text-sm focus:border-[#1249dc] focus:outline-none" />
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-xs uppercase tracking-wide text-[#9b9aa5]">License Number</label>
                <input type="text" name="licenseNumber" required class="w-full rounded-md border border-[#2a2932] bg-[#1b1a21] px-3 py-2.5 text-sm focus:border-[#1249dc] focus:outline-none" />
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="w-full rounded-md bg-[#1249dc] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#1d58f1]">Create Account</button>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-[#9b9aa5]">Already registered? <a th:href="@{/login}" class="font-semibold text-[#1249dc] hover:underline">Sign in</a></p>
    </section>
</div>
</body>
</html>
