<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Users</title></head><body><main><section class="rounded-2xl border border-app-border bg-app-panel p-6"><div class="mb-5 flex items-center justify-between"><h3 class="text-xl font-semibold">All users</h3><span class="text-sm text-app-muted" th:text="${#lists.size(users)} + ' total'"></span></div><div class="overflow-x-auto rounded-xl border border-app-border"><table class="min-w-full text-[15px]"><thead class="bg-app-panel2 text-app-muted"><tr><th class="px-4 py-3 text-left">Name</th><th class="px-4 py-3 text-left">Email</th><th class="px-4 py-3 text-left">Phone</th><th class="px-4 py-3 text-left">Role</th><th class="px-4 py-3 text-right">Action</th></tr></thead><tbody><tr th:each="user : ${users}" class="border-t border-app-border hover:bg-slate-800/40"><td class="px-4 py-3" th:text="${user.name}"></td><td class="px-4 py-3 text-app-muted" th:text="${user.email}"></td><td class="px-4 py-3 text-app-muted" th:text="${user.phone}"></td><td class="px-4 py-3"><span class="rounded-full border border-app-border px-2 py-1 text-xs" th:text="${user.role}"></span></td><td class="px-4 py-3 text-right"><form th:action="@{/admin/users/delete/{id}(id=${user.userId})}" method="post" class="inline"><button type="submit" class="rounded-lg border border-red-500/40 px-3 py-1.5 text-xs font-medium text-red-300 hover:bg-red-500/10">Delete</button></form></td></tr></tbody></table></div></section></main></body></html>
