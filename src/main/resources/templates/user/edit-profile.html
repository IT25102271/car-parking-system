<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Profile</title></head>
<body>
<main>
    <form th:action="@{/user/profile/update}" method="post" class="mx-auto max-w-md space-y-4">
        <input type="hidden" name="userId" th:value="${user.userId}" />
        <div>
            <label class="mb-1 block text-xs text-app-muted">Full name</label>
            <input type="text" name="name" th:value="${user.name}" required
                   class="w-full rounded border border-app-border bg-app-panel2 px-3 py-2 text-sm focus:border-app-accent focus:outline-none" />
        </div>
        <div>
            <label class="mb-1 block text-xs text-app-muted">Phone</label>
            <input type="text" name="phone" th:value="${user.phone}" required
                   class="w-full rounded border border-app-border bg-app-panel2 px-3 py-2 text-sm focus:border-app-accent focus:outline-none" />
        </div>
        <div class="flex gap-2 border-t border-app-border pt-4">
            <button type="submit" class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Save</button>
            <a th:href="@{/user/profile}" class="rounded px-3 py-2 text-xs font-medium text-app-muted ring-1 ring-app-border hover:text-app-text">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
