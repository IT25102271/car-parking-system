<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Profile</title></head>
<body>
<main>
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-app-border pb-4">
        <div>
            <p class="text-xl font-semibold" th:text="${user.name}">Name</p>
            <span class="mt-1 inline-block rounded px-2 py-0.5 text-xs font-medium text-app-accent ring-1 ring-app-accent/25"
                  th:text="${user.role}">USER</span>
        </div>
        <a th:href="@{/user/profile/edit}"
           class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Edit profile</a>
    </div>

    <dl class="grid max-w-xl gap-4 text-sm md:grid-cols-2">
        <div>
            <dt class="text-xs text-app-muted">Email</dt>
            <dd class="mt-1 font-medium" th:text="${user.email}"></dd>
        </div>
        <div>
            <dt class="text-xs text-app-muted">Phone</dt>
            <dd class="mt-1 font-medium" th:text="${user.phone}"></dd>
        </div>
        <div class="md:col-span-2">
            <dt class="text-xs text-app-muted">User ID</dt>
            <dd class="mt-1 break-all font-mono text-xs" th:text="${user.userId}"></dd>
        </div>
    </dl>
</main>
</body>
</html>
