<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Vehicles</title></head>
<body>
<main>
    <div class="mb-4 flex justify-end">
        <a th:href="@{/user/vehicles/add}"
           class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Add vehicle</a>
    </div>

    <div th:if="${!vehicles.isEmpty()}" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
        <article th:each="vehicle : ${vehicles}"
                 class="overflow-hidden rounded-lg border border-app-border bg-app-panel">
            <div class="h-40 bg-app-panel2">
                <img th:if="${vehicle.vehicleUrl != null && !vehicle.vehicleUrl.isEmpty()}"
                     th:src="${vehicle.vehicleUrl}"
                     alt="Vehicle"
                     class="h-full w-full object-cover" />
                <div th:if="${vehicle.vehicleUrl == null || vehicle.vehicleUrl.isEmpty()}"
                     class="flex h-full items-center justify-center text-xs text-app-muted">No image</div>
            </div>
            <div class="border-t border-app-border p-4">
                <div class="flex items-center justify-between">
                    <p class="text-lg font-bold tracking-tight" th:text="${vehicle.plateNumber}">PLATE</p>
                    <span class="rounded px-2 py-0.5 text-xs font-medium text-app-accent ring-1 ring-app-accent/25"
                          th:text="${vehicle.type}">TYPE</span>
                </div>
                <p class="mt-1 text-sm font-medium" th:text="${vehicle.make} + ' ' + ${vehicle.model}">Make Model</p>
                <p class="text-xs text-app-muted">Color <span class="text-app-text" th:text="${vehicle.color}">—</span></p>
                <div class="mt-3 flex gap-2">
                    <a th:href="@{/user/vehicles/edit/{id}(id=${vehicle.vehicleId})}"
                       class="rounded px-2.5 py-1 text-xs font-medium text-app-muted ring-1 ring-app-border hover:text-app-text">Edit</a>
                    <form th:action="@{/user/vehicles/delete/{id}(id=${vehicle.vehicleId})}" method="post">
                        <button type="submit"
                                class="rounded px-2.5 py-1 text-xs font-medium text-red-400 ring-1 ring-red-500/30 hover:bg-red-500/10">Delete</button>
                    </form>
                </div>
            </div>
        </article>
    </div>

    <div th:if="${vehicles.isEmpty()}"
         class="rounded-sm border border-dashed border-app-border bg-app-panel p-10 text-center text-sm text-app-muted">
        No vehicles yet.
        <a th:href="@{/user/vehicles/add}" class="ml-1 font-medium text-app-accent hover:underline">Add vehicle</a>
    </div>
</main>
</body>
</html>
