<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Vehicles</title>
  </head>
  <body>
    <main>
      <h3 class="text-xl font-semibold">All vehicles</h3>

      <div
        th:if="${!vehicles.isEmpty()}"
        class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      >
        <article
          th:each="vehicle : ${vehicles}"
          class="overflow-hidden rounded-xl border border-app-border bg-app-panel"
        >
          <div class="h-32 bg-app-panel2 sm:h-36">
            <img
              th:if="${vehicle.vehicleUrl != null && !vehicle.vehicleUrl.isEmpty()}"
              th:src="${vehicle.vehicleUrl}"
              alt="Vehicle"
              class="h-full w-full object-cover"
            />
            <div
              th:if="${vehicle.vehicleUrl == null || vehicle.vehicleUrl.isEmpty()}"
              class="flex h-full items-center justify-center text-xs text-app-muted"
            >
              No image
            </div>
          </div>
          <div class="border-t border-app-border p-3 sm:p-3.5">
            <div class="flex items-start justify-between gap-2">
              <p
                class="font-mono text-sm font-semibold tracking-wide text-app-text"
                th:text="${vehicle.plateNumber}"
              >
                PLATE
              </p>
              <span
                class="shrink-0 rounded-full border border-app-border px-2 py-0.5 text-[11px] font-medium text-app-accent sm:text-xs"
                th:text="${vehicle.type}"
                >TYPE</span
              >
            </div>
            <p
              class="mt-1.5 text-sm font-medium leading-snug"
              th:text="${vehicle.make} + ' ' + ${vehicle.model}"
            >
              Make Model
            </p>
            <p class="mt-1 text-xs text-app-muted">
              <span class="text-app-text" th:text="${vehicle.color}">—</span>
            </p>
            <p
              class="mt-2 border-t border-app-border pt-2 text-xs text-app-muted"
            >
              <span class="uppercase tracking-wider text-[10px]">Owner</span>
              <span
                class="mt-0.5 block font-mono text-sm text-app-text"
                th:text="${vehicle.ownerId}"
                >—</span
              >
            </p>
            <div class="mt-3 flex gap-2">
              <form
                th:action="@{/user/vehicles/delete/{id}(id=${vehicle.vehicleId})}"
                method="post"
                class="flex-1"
              >
                <button
                  type="submit"
                  class="w-full rounded-lg border border-red-500/40 px-3 py-1.5 text-xs font-medium text-red-300 hover:bg-red-500/10"
                >
                  Delete
                </button>
              </form>
            </div>
          </div>
        </article>
      </div>

      <div
        th:if="${vehicles.isEmpty()}"
        class="mt-10 rounded-lg border border-dashed border-app-border py-14 text-center text-sm text-app-muted"
      >
        No vehicles registered.
      </div>
    </main>
  </body>
</html>
