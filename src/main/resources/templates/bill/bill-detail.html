<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Bill Details</title></head>
<body>
<main class="mx-auto max-w-3xl">
    <dl class="grid gap-px overflow-hidden rounded-sm border border-app-border bg-app-border text-sm md:grid-cols-2">
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Bill ID</dt>
            <dd class="mt-1 font-mono text-xs" th:text="${bill.billId}"></dd>
        </div>
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Status</dt>
            <dd class="mt-1"><span class="rounded px-2 py-0.5 text-xs font-medium text-app-accent ring-1 ring-app-accent/25"
                                    th:text="${bill.status}"></span></dd>
        </div>
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Reservation</dt>
            <dd class="mt-1 font-mono text-xs" th:text="${bill.reservationId}"></dd>
        </div>
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Vehicle</dt>
            <dd class="mt-1 font-medium" th:text="${bill.vehiclePlate}"></dd>
        </div>
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Slot</dt>
            <dd class="mt-1" th:text="${bill.slotNumber}"></dd>
        </div>
        <div class="bg-app-panel p-4">
            <dt class="text-xs text-app-muted">Duration</dt>
            <dd class="mt-1" th:text="${bill.durationHours} + 'h'"></dd>
        </div>
        <div class="bg-app-panel p-4 md:col-span-2">
            <dt class="text-xs text-app-muted">Final amount</dt>
            <dd class="mt-1 text-lg font-semibold" th:text="'LKR ' + ${bill.finalAmount}"></dd>
        </div>
    </dl>
    <form th:if="${bill.status != 'PAID'}" th:action="@{/user/bills/pay/{id}(id=${bill.billId})}" method="post" class="mt-4">
        <button type="submit" class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Pay now</button>
    </form>
</main>
</body>
</html>
