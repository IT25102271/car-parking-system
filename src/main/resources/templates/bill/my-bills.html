<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Bills</title></head>
<body>
<main>
    <div class="overflow-x-auto rounded-sm border border-app-border bg-app-panel">
        <table class="min-w-full text-[15px] tabular-nums">
            <thead class="border-b border-app-border bg-app-panel2">
            <tr>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Bill</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Date</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Amount</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Status</th>
                <th class="px-5 py-3.5 text-right text-sm font-semibold uppercase tracking-wide text-app-muted">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-app-border">
            <tr th:each="bill : ${bills}" class="hover:bg-app-panel2/70">
                <td class="px-5 py-3.5 font-mono text-sm" th:text="${bill.billId}"></td>
                <td class="px-5 py-3.5" th:text="${bill.createdDate}"></td>
                <td class="px-5 py-3.5" th:text="'LKR ' + ${bill.finalAmount}"></td>
                <td class="px-5 py-3.5">
                    <span class="rounded px-2 py-0.5 text-xs font-medium text-app-accent ring-1 ring-app-accent/25"
                          th:text="${bill.status}"></span>
                </td>
                <td class="px-5 py-3.5 text-right">
                    <a th:href="@{/user/bills/{id}(id=${bill.billId})}"
                       class="mr-2 inline-block rounded px-2 py-1 text-xs font-medium text-app-muted ring-1 ring-app-border hover:text-app-text">View</a>
                    <form th:if="${bill.status != 'PAID'}" th:action="@{/user/bills/pay/{id}(id=${bill.billId})}" method="post" class="inline">
                        <button type="submit"
                                class="rounded px-2 py-1 text-xs font-semibold text-white bg-app-accent hover:bg-app-accent/90">Pay</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
