<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${#strings.trim(#strings.replace(#strings.replace(#strings.replace(#strings.replace(title, '&lt;title&gt;', ''), '&lt;/title&gt;', ''), '<title>', ''), '</title>', ''))} + ' | CarParking'">CarParking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
                    },
                    colors: {
                        app: {
                            bg: "#0b0b10",
                            panel: "#131216",
                            panel2: "#1b1a21",
                            border: "#2a2932",
                            muted: "#9b9aa5",
                            text: "#f2f3f7",
                            accent: "#1249dc",
                            danger: "#ef4444"
                        }
                    },
                    boxShadow: {
                        soft: "0 8px 30px rgba(0, 0, 0, 0.35)",
                        glow: "0 0 0 1px rgba(18,73,220,0.35), 0 10px 35px rgba(18,73,220,0.18)"
                    }
                }
            }
        }
    </script>
    <style>
        .nav-link.active {
            background: rgba(18, 73, 220, 0.12);
            color: #ffffff;
            border: 1px solid rgba(18, 73, 220, 0.35);
        }
    </style>
</head>
<body class="min-h-screen bg-app-bg text-app-text font-sans antialiased">
<div class="min-h-screen lg:grid lg:grid-cols-[272px_1fr]">
    <aside class="border-r border-app-border bg-app-panel">
        <div class="border-b border-app-border px-5 py-5">
            <p class="text-[11px] uppercase tracking-[0.22em] text-app-muted">Smart Parking</p>
            <h1 class="mt-2 text-xl font-extrabold tracking-tight">CarParking</h1>
        </div>

        <div class="px-3 py-4">
            <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.14em] text-app-muted">Menu</p>

            <nav th:if="${session.loggedUser != null && session.loggedUser.role == 'ADMIN'}" class="mt-3 space-y-1.5 text-sm">
                <a th:href="@{/admin/dashboard}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="layout-dashboard" class="h-4 w-4"></i><span>Dashboard</span></a>
                <a th:href="@{/admin/users}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="users" class="h-4 w-4"></i><span>Users</span></a>
                <a th:href="@{/admin/vehicles}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="car" class="h-4 w-4"></i><span>Vehicles</span></a>
                <a th:href="@{/admin/slots}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="parking-square" class="h-4 w-4"></i><span>Slots</span></a>
                <a th:href="@{/admin/reservations}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="calendar-days" class="h-4 w-4"></i><span>Reservations</span></a>
                <a th:href="@{/admin/bills}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="receipt-text" class="h-4 w-4"></i><span>Bills</span></a>
                <a th:href="@{/admin/feedbacks}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="messages-square" class="h-4 w-4"></i><span>Feedback</span></a>
            </nav>

            <nav th:if="${session.loggedUser != null && session.loggedUser.role == 'USER'}" class="mt-3 space-y-1.5 text-sm">
                <a th:href="@{/user/dashboard}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="layout-dashboard" class="h-4 w-4"></i><span>Dashboard</span></a>
                <a th:href="@{/user/profile}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="user-circle-2" class="h-4 w-4"></i><span>Profile</span></a>
                <a th:href="@{/user/vehicles}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="car" class="h-4 w-4"></i><span>My Vehicles</span></a>
                <a th:href="@{/user/slots}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="map-pinned" class="h-4 w-4"></i><span>Available Slots</span></a>
                <a th:href="@{/user/reservations}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="calendar-days" class="h-4 w-4"></i><span>Reservations</span></a>
                <a th:href="@{/user/bills}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="wallet-cards" class="h-4 w-4"></i><span>Bills</span></a>
                <a th:href="@{/user/feedbacks}" class="nav-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-app-muted hover:bg-app-panel2 hover:text-white"><i data-lucide="messages-square" class="h-4 w-4"></i><span>Feedback</span></a>
            </nav>
        </div>

        <div class="mt-auto border-t border-app-border px-4 py-5">
            <a th:href="@{/logout}" class="flex items-center justify-center gap-2 rounded-lg border border-red-500/30 px-3 py-2.5 text-sm font-semibold text-red-300 hover:bg-red-500/10">
                <i data-lucide="log-out" class="h-4 w-4"></i><span>Logout</span>
            </a>
        </div>
    </aside>

    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-20 border-b border-app-border bg-app-bg">
            <div class="flex items-center justify-between gap-4 px-6 py-4 lg:px-10">
                <div>
                    <h2 class="text-xl font-bold tracking-tight" th:text="${#strings.trim(#strings.replace(#strings.replace(#strings.replace(#strings.replace(title, '&lt;title&gt;', ''), '&lt;/title&gt;', ''), '<title>', ''), '</title>', ''))}">Dashboard</h2>
                    <p class="text-xs text-app-muted">Car parking operations center</p>
                </div>
                <div th:if="${session.loggedUser != null}" class="rounded-lg border border-app-border bg-app-panel2 px-3 py-2 text-xs">
                    <span class="font-semibold" th:text="${session.loggedUser.name}">User</span>
                    <span class="mx-2 text-app-muted">•</span>
                    <span class="font-medium text-app-accent" th:text="${session.loggedUser.role}">ROLE</span>
                </div>
            </div>
        </header>

        <main class="flex-1 px-6 py-6 lg:px-10">
            <th:block th:replace="${content}" />
        </main>
    </div>
</div>

<script>
    (function () {
        var path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(function (link) {
            var href = link.getAttribute('href');
            if (!href) return;
            if (path === href || (path.startsWith(href) && href !== '/')) {
                link.classList.add('active');
            }
        });
        if (window.lucide) {
            window.lucide.createIcons();
        }
    })();
</script>
</body>
</html>
