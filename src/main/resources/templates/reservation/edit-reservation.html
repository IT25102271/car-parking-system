<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Edit Reservation</title></head><body><main><section class="mx-auto max-w-2xl rounded-2xl border border-app-border bg-app-panel p-7"><h3 class="text-xl font-semibold">Edit reservation</h3><form th:action="@{/user/reservations/update}" method="post" class="mt-6 space-y-4"><input type="hidden" name="reservationId" th:value="${reservation.reservationId}" /><div><label class="mb-2 block text-sm text-app-muted">Start time</label><input type="time" name="startTime" th:value="${reservation.startTime}" required class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm" /></div><div><label class="mb-2 block text-sm text-app-muted">Duration hours</label><input type="number" name="durationHours" th:value="${reservation.durationHours}" min="1" max="24" required class="w-full rounded-xl border border-app-border bg-app-panel2 px-4 py-3 text-sm" /></div><div class="flex gap-3"><button type="submit" class="rounded-lg bg-app-accent px-4 py-2 text-sm font-semibold text-white hover:bg-app-accent/90">Update reservation</button><a th:href="@{/user/reservations}" class="rounded-lg border border-app-border px-4 py-2 text-sm">Cancel</a></div></form></section></main></body></html>
