<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Reservations</title></head>
<body>
<main>
    <div class="mb-4 flex justify-end">
        <a th:href="@{/user/reservations/book}"
           class="rounded bg-app-accent px-3 py-2 text-xs font-semibold text-white hover:bg-app-accent/90">Book slot</a>
    </div>

    <div class="overflow-x-auto rounded-sm border border-app-border bg-app-panel">
        <table class="min-w-full text-[15px] tabular-nums">
            <thead class="border-b border-app-border bg-app-panel2">
            <tr>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Date</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Time</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Slot</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Vehicle</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Duration</th>
                <th class="px-5 py-3.5 text-left text-sm font-semibold uppercase tracking-wide text-app-muted">Status</th>
                <th class="px-5 py-3.5 text-right text-sm font-semibold uppercase tracking-wide text-app-muted">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-app-border">
            <tr th:each="res : ${reservations}" class="hover:bg-app-panel2/70">
                <td class="px-5 py-3.5" th:text="${res.reservationDate}"></td>
                <td class="px-5 py-3.5" th:text="${res.startTime}"></td>
                <td class="px-5 py-3.5" th:text="${res.slotNumber}"></td>
                <td class="px-5 py-3.5" th:text="${res.vehiclePlate}"></td>
                <td class="px-5 py-3.5" th:text="${res.durationHours} + 'h'"></td>
                <td class="px-5 py-3.5">
                    <span class="rounded px-2 py-0.5 text-xs font-medium text-app-accent ring-1 ring-app-accent/25"
                          th:text="${res.status}"></span>
                </td>
                <td class="px-5 py-3.5 text-right">
                    <a th:href="@{/user/reservations/edit/{id}(id=${res.reservationId})}"
                       class="mr-2 inline-block rounded px-2 py-1 text-xs font-medium text-app-muted ring-1 ring-app-border hover:text-app-text">Edit</a>
                    <form th:action="@{/user/reservations/cancel/{id}(id=${res.reservationId})}" method="post" class="inline">
                        <button type="submit"
                                class="rounded px-2 py-1 text-xs font-medium text-red-400 ring-1 ring-red-500/30 hover:bg-red-500/10">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
