<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"><head><title>Reservations</title></head><body><main><section class="rounded-2xl border border-app-border bg-app-panel p-6"><h3 class="text-xl font-semibold">All reservations</h3><div class="mt-5 overflow-x-auto rounded-xl border border-app-border"><table class="min-w-full text-[15px]"><thead class="bg-app-panel2 text-app-muted"><tr><th class="px-4 py-3 text-left">User</th><th class="px-4 py-3 text-left">Date</th><th class="px-4 py-3 text-left">Time</th><th class="px-4 py-3 text-left">Slot</th><th class="px-4 py-3 text-left">Vehicle</th><th class="px-4 py-3 text-left">Status</th><th class="px-4 py-3 text-right">Actions</th></tr></thead><tbody><tr th:each="res : ${reservations}" class="border-t border-app-border hover:bg-slate-800/40"><td class="px-4 py-3" th:text="${res.userId}"></td><td class="px-4 py-3" th:text="${res.reservationDate}"></td><td class="px-4 py-3" th:text="${res.startTime}"></td><td class="px-4 py-3" th:text="${res.slotNumber}"></td><td class="px-4 py-3" th:text="${res.vehiclePlate}"></td><td class="px-4 py-3"><span class="rounded-full border border-app-border px-2 py-1 text-xs" th:text="${res.status}"></span></td><td class="px-4 py-3 text-right"><form th:action="@{/admin/bills/generate}" method="post" class="inline"><input type="hidden" name="reservationId" th:value="${res.reservationId}" /><button type="submit" class="rounded-lg border border-app-accent/40 px-3 py-1.5 text-xs text-app-accent hover:bg-app-accent/10">Generate bill</button></form> <form th:action="@{/admin/reservations/delete/{id}(id=${res.reservationId})}" method="post" class="inline"><button type="submit" class="rounded-lg border border-red-500/40 px-3 py-1.5 text-xs text-red-300 hover:bg-red-500/10">Delete</button></form></td></tr></tbody></table></div></section></main></body></html>
